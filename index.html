<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Catan Board Generator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="header">
      <div id="title">CATAN</div>
      <!-- shuffle image is 214 x 188 px -->
      <button id="shuffle"><img src="shuffleblack.png" alt="Shuffle" style="width:55px;height:45px;" onclick="regenerateBoard()"/></button>
    </div>
    <div id="visualboard"></div>
    <script src="generate.js"></script>
    
    <!-- <input type="checkbox" id="redBackground" name="redbackground" value="RedBackground" onclick="changeBackground(this)"> -->
    <!-- <label for="redbackground">Red background</label><br> -->
    
    <!-- <input type="checkbox" id="colorTextOnly" name="colortextonly" value="ColorTextOnly" checked="true" onclick="changeColorTextOnly(this)"> -->
    <!-- <label for="colortextonly">Color entire tile</label><br> -->

    <!-- <input type="checkbox" id="alternateVisuals" name="alternatevisuals" value="AlternateVisuals" onclick="changeAlternateVisuals(this)"> -->
    <!-- <label for="alternatevisuals">Use alternate visuals</label><br> -->
    <div id="optionssection">
      <div class="options-header">THEME</div>
      
      <button type="button" class="options selected-button" id="ravenblackbutton" onclick="changeAlternateVisuals(false)">Raven black</button>
      <button type="button" class="options" id="sunriseredbutton" onclick="changeAlternateVisuals(true)">Sunrise red</button>
      <br>
  
      <div class="options-header">RESOURCES</div>
      
      <button type="button" class="options selected-button" id="adjacenttwo" onclick="changeLimitAdjacentResources(2)">Max 2 adjacent</button>
      <button type="button" class="options" id="adjacentthree" onclick="changeLimitAdjacentResources(3)">Max 3 adjacent</button>
      <button type="button" class="options" id="adjacentunlimited" onclick="changeLimitAdjacentResources(100)">Unlimited adjacent</button>
      <br>

      <div class="options-header">COMMON NUMBERS - 5, 6, 8, 9</div>
      <button type="button" class="options selected-button" id="commontwo" onclick="changeRequireCommonNumbersForEachResource(2)">Min 2 per resource</button>
      <button type="button" class="options" id="commonone" onclick="changeRequireCommonNumbersForEachResource(1)">Min 1 per resource</button>
      <button type="button" class="options" id="commonany" onclick="changeRequireCommonNumbersForEachResource(0)">Unrestricted</button>
      <br>

      <div class="options-header">RED NUMBERS - 6, 8</div>
      <button type="button" class="options selected-button" id="noadjacentreds" onclick="changeLimitAdjacentVeryCommonNumbers(1)">None adjacent</button>
      <button type="button" class="options" id="twoadjacentreds" onclick="changeLimitAdjacentVeryCommonNumbers(2)">Max 2 adjacent</button>
      <button type="button" class="options" id="unlimitedadjacentreds" onclick="changeLimitAdjacentVeryCommonNumbers(100)">Unlimited adjacent</button>
      <br>

      <div class="options-header">RARE NUMBERS - 2, 3, 11, 12</div>
      <button type="button" class="options selected-button" id="raretwo" onclick="changeLimitAdjacentRareNumbers(2)">Max 2 adjacent</button>
      <button type="button" class="options" id="rarethree" onclick="changeLimitAdjacentRareNumbers(3)">Max 3 adjacent</button>
      <button type="button" class="options" id="rareunlimited" onclick="changeLimitAdjacentRareNumbers(100)">Unlimited adjacent</button>
      <br>

      <div class="options-header">DESERTS</div>
      
      <button type="button" class="options selected-button" id="desertsedges" onclick="changeRequireDesertsOnEdges(true)">Deserts on edges</button>
      <button type="button" class="options" id="desertsanywhere" onclick="changeRequireDesertsOnEdges(false)">Deserts anywhere</button>
      <br>

      <button type="button" class="options selected-button" id="noadjacentdeserts" onclick="changeLimitAdjacentDeserts(true)">None adjacent</button>
      <button type="button" class="options" id="adjacentdeserts" onclick="changeLimitAdjacentDeserts(false)">Unlimited adjacent</button>
      
    </div>
    
    <!-- <input type="checkbox" id="limitAdjacentResources" name="limitadjacentresources" value="LimitAdjacentResources" checked="true" onclick="changeLimitAdjacentResources(this)"> -->
    <!-- <label for="limitadjacentresources">Limit adjacent tiles of the same resource to 2</label><br> -->

    <!-- <input type="checkbox" id="requireDesertsOnEdges" name="requiredesertsonedges" value="RequireDesertsOnEdges" checked="true" onclick="changeRequireDesertsOnEdges(this)"> -->
    <!-- <label for="requiredesertsonedges">Deserts must be on the edges</label><br> -->

    <!-- <input type="checkbox" id="limitAdjacentDeserts" name="limitadjacentdeserts" value="LimitAdjacentDeserts" checked="true" onclick="changeLimitAdjacentDeserts(this)"> -->
    <!-- <label for="limitadjacentdeserts">Deserts may not touch</label><br> -->
  </body>
</html>
